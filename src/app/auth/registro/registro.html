<!-- CONTAINER PRINCIPAL-->
<div class="flex min-h-screen items-center justify-center bg-terciaria p-4">
    <!-- CARTÃO PRINCIPAL -->
    <div class="grid w-full max-w-5xl overflow-hidden rounded-2xl bg-secundaria shadow-2xl md:grid-cols-2">
        <!-- LADO ESQUERDO -->
        <div class="flex flex-col items-center justify-center p-8 lg:p-12 text-center bg-primaria">
            <!-- CAIXA DE REGISTRO -->
            <div class="w-full rounded-xl bg-secundaria p-8 shadow-xl">

                <!-- TÍTULO -->
                <div class="mb-6 flex flex-col items-center">
                    <div class="flex items-center gap-2 text-xl font-bold text-gray-800">
                        Nome da Empresa
                    </div>
                    <h3 class="mt-4 text-lg font-medium text-gray-700">Registrar</h3>
                </div>

                <!-- FORMULÁRIO -->
                <form class="space-y-4">
                    <!-- NOME -->
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1">Nome completo</label>
                        <input type="text" placeholder="Seu nome completo" class="input-padrao" />
                    </div>

                    <!-- EMAIL -->
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1">Email</label>
                        <input type="email" placeholder="email@examplo.com" class="input-padrao" />
                    </div>

                    <!-- CEP -->
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1">CEP</label>
                        <div class="flex gap-3">
                            <input type="text" id="cep" name="cep" placeholder="00000-000" maxlength="9"
                                pattern="\d{5}-\d{3}" required class="input-padrao" />
                            <button type="button" class="w-1/3 btn-primario">
                                BUSCAR
                            </button>
                        </div>
                    </div>

                    <!-- ENDEREÇO COMPLETO -->
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1">Endereço completo</label>
                        <input type="text" placeholder="Rua, número, bairro, cidade" class="input-padrao" />
                    </div>

                    <!-- TELEFONE -->
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1">Número de telefone</label>
                        <input type="tel" placeholder="(00) 00000-0000" class="input-padrao" />
                    </div>

                    <!-- CPF -->
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1">CPF</label>
                        <input type="text" placeholder="000.000.000-00" maxlength="14" class="input-padrao" />
                    </div>

                    <!-- BOTÕES-->
                    <div class="flex gap-3 pt-2">
                        <button type="submit" class="w-1/2 btn-primario">
                            REGISTRAR
                        </button>
                        <a routerLink="/" class="w-1/2 btn-secundario text-center">
                            JÁ TENHO CONTA
                        </a>
                    </div>
                </form>

            </div>

        </div>
        <!-- LADO DIREITO -->
        <div class="flex items-center justify-center bg-secundaria p-8 lg:p-16">
            <h2 class="mb-6 text-2xl font-bold tracking-tight text-primaria md:text-3xl">
                Registre-se agora.
            </h2>
        </div>
    </div>
</div>
