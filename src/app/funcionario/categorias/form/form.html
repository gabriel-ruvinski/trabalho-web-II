<header class="fixed h-16 top-0 left-0 right-0 z-50 bg-white shadow-md">
  <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-center">
    <h1>Gerenciar</h1>
  </div>

  <div class="flex justify-end gap-4 mx-5 -mt-11">
    <span>Olá Gerente</span>
    <button type="button" class="btn-primario">Sair</button>
  </div>
</header>

<div class="flex min-h-screen bg-terciaria pt-16">


  <aside class="w-56 flex-shrink-0 bg-primaria text-white p-5">
    <nav class="flex flex-col gap-5 py-4">
      <h2 class="text-xl font-bold mb-4 text-white text-center">
        Menu
      </h2>

      <a routerLink="/funcionario/home">Inicio</a>
      <a routerLink="/lista-solicitacoes">Solicitações</a>
      <a routerLink="/relatorios">Relatórios</a>
    </nav>
  </aside>

  
  <main class="flex-1 p-6">

    <div class="mx-auto max-w-2xl rounded-2xl bg-secundaria p-10 shadow-xl">

      <div class="mb-8">
        <h2 class="text-2xl font-semibold">
          {{ categoria.id === 0 ? 'Nova Categoria' : 'Editar Categoria' }}
        </h2>

        <p class="mt-2 text-sm text-gray-500">
          {{
            categoria.id === 0
              ? 'Cadastre uma nova categoria de equipamento.'
              : 'Altere os dados da categoria de equipamento.'
          }}
        </p>
      </div>

      <form class="space-y-6" (ngSubmit)="salvar()">

        <div>
          <label
            for="nome"
            class="mb-2 block text-sm font-semibold text-gray-500"
          >
            Nome da Categoria
          </label>

          <input
            id="nome"
            name="nome"
            type="text"
            [(ngModel)]="categoria.nome"
            placeholder="Ex.: Notebook"
            maxlength="50"
            class="input-padrao w-full"
          />

          <p class="mt-1 text-xs text-gray-400">
            Informe o nome da categoria de equipamento.
          </p>
        </div>

        <div class="flex gap-4 pt-4">
          <button
            type="button"
            class="w-1/2 btn-secundario"
            (click)="cancelar()"
          >
            CANCELAR
          </button>

          <button
            type="submit"
            class="w-1/2 btn-primario"
          >
            {{ categoria.id === 0 ? 'SALVAR' : 'ATUALIZAR' }}
          </button>
        </div>

      </form>
    </div>

  </main>
</div>
