<div class="min-h-screen bg-terciaria p-6">

        </tr>
      </thead>
      <tbody>
        <tr class="border-b">
          <td class="py-3 font-medium text-gray-800">Notebook</td>
          <td class="py-3">
            <span class="rounded-full bg-green-100 px-2 py-1 text-xs font-semibold text-green-700">

            </span>
          </td>
          <td class="py-3 text-right">
            <div class="flex justify-end gap-2">
              <button type="button" class="btn-secundario">Editar</button>

                class="rounded-md bg-erro px-md py-sm text-xs font-bold text-white transition hover:brightness-90"

              </button>
            </div>

        </tr>
        <tr class="border-b">
          <td class="py-3 font-medium text-gray-800">Desktop</td>

            <span class="rounded-full bg-green-100 px-2 py-1 text-xs font-semibold text-green-700">

            </span>
          </td>
          <td class="py-3 text-right">
            <div class="flex justify-end gap-2">
              <button type="button" class="btn-secundario">Editar</button>

                Remover
              </button>
            </div>

        </tr>
        <tr class="border-b last:border-0">
          <td class="py-3 font-medium text-gray-800">Impressora</td>
          <td class="py-3">
            <span class="rounded-full bg-gray-100 px-2 py-1 text-xs font-semibold text-gray-500">
              Inativa
            </span>
          </td>
          <td class="py-3 text-right">
            <div class="flex justify-end gap-2">
              <button type="button" class="btn-secundario">Editar</button>
              <button type="button" class="btn-secundario">Reativar</button>
            </div>

      </tbody>
