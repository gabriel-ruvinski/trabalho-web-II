<div class="mx-auto max-w-4xl rounded-2xl bg-secundaria p-8 shadow-xl">

  <div class="mb-6 flex items-center justify-between">

    <div>
      <h2 class="text-2xl font-semibold">
        Categorias de Equipamento
      </h2>

      <p class="mt-2 text-sm text-gray-500">
        Gerencie as categorias usadas nas solicitações de manutenção.
      </p>
    </div>

    <button type="button" class="btn-primario" (click)="novaCategoria()">
      + NOVA CATEGORIA
    </button>

  </div>

  <table class="w-full text-left text-sm">

    <thead>
      <tr class="border-b text-xs uppercase text-gray-400">

        <th class="py-3">
          Nome
        </th>

        <th class="py-3">
          Status
        </th>

        <th class="py-3 text-right">
          Ações
        </th>

      </tr>
    </thead>

    <tbody>

      @for (categoria of categorias; track categoria.id) {

      <tr class="border-b last:border-0">

        <td class="py-4 font-medium text-gray-800">
          {{ categoria.nome }}
        </td>

        <td class="py-4">

          @if (categoria.ativa) {

          <span class="rounded-full bg-green-100 px-3 py-1 text-xs font-semibold text-green-700">
            Ativa
          </span>

          } @else {

          <span class="rounded-full bg-gray-100 px-3 py-1 text-xs font-semibold text-gray-500">
            Inativa
          </span>

          }

        </td>

        <td class="py-4 text-right">

          <div class="flex justify-end gap-2">

            <button type="button" class="btn-secundario" (click)="editar(categoria.id)">
              Editar
            </button>

            @if (categoria.ativa) {

            <button type="button"
              class="rounded-md bg-erro px-md py-sm text-xs font-bold text-white transition hover:brightness-90"
              (click)="remover(categoria.id)">
              Remover
            </button>

            } @else {

            <button type="button" class="btn-secundario" (click)="reativar(categoria.id)">
              Reativar
            </button>

            }

          </div>

        </td>

      </tr>

      }

    </tbody>

  </table>

</div>
