@if (aberto) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4"
    role="dialog"
    aria-modal="true"
    aria-labelledby="confirm-dialog-titulo"
    (click)="cancelar()"
  >
    <div
      class="w-full rounded-2xl bg-white p-6 shadow-2xl"
      style="max-width: 448px;"
      (click)="$event.stopPropagation()"
    >
      <h2
        id="confirm-dialog-titulo"
        class="text-xl font-bold"
        [class.text-erro]="erro"
        [class.text-gray-900]="!erro"
      >
        {{ titulo }}
      </h2>

      <p class="mt-3 whitespace-pre-line text-sm text-gray-600">
        {{ mensagem }}
      </p>

      <div class="mt-6 flex justify-end gap-3">
        @if (mostrarCancelar) {
          <button
            type="button"
            class="btn-secundario cursor-pointer"
            (click)="cancelar()"
          >
            Cancelar
          </button>
        }

        <button
          type="button"
          class="btn-primario cursor-pointer"
          autofocus
          (click)="confirmar()"
        >
          {{ textoConfirmar }}
        </button>
      </div>
    </div>
  </div>
}
